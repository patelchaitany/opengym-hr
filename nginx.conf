# openGym — standalone web server: serves the static app and proxies /api to the
# backend and /hr to the heart-rate bridge, so the whole app lives on ONE origin
# (required for WebAuthn / passkeys, and it is what lets a phone reach the strap
# without being told an IP address).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Heart rate → hr-bridge. Kept on the same origin as the app so a phone
    # needs no address, no CORS and no mixed-content exception — Settings' HR
    # address field can stay empty. The trailing slash on proxy_pass strips the
    # /hr prefix, so /hr/api/info reaches the bridge as /api/info.
    #
    # The bridge runs on the host, not in a container: it needs the Bluetooth
    # radio. Change the address here if it is on another machine.
    location /hr/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        # /hr/ws is a WebSocket — without these two it is answered as a plain
        # request and the live feed silently never starts.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A heart-rate stream is open for the length of a workout; the default
        # 60 s read timeout would cut it every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
